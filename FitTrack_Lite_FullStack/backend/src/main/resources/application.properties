spring.application.name=fittrack-lite
# Render/Railway inject PORT; locally it is 8080
server.port=${PORT:8080}
# Trust X-Forwarded-* headers when running behind Vercel / Render proxies
server.forward-headers-strategy=framework

# ---- Database (MySQL) ----
# Local default: MySQL on localhost, user root / password root. Override with env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fittrack_lite?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Frontend origin(s) allowed by CORS (comma-separated) ----
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- Session cookie ----
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
